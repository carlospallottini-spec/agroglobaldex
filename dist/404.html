<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — AgroGlobalDex</title>
<meta name="robots" content="noindex">

<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#00FF6A"><link rel="apple-touch-icon" href="/icons/icon-192.png"><link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/alive.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
nav.main-nav{background:rgba(5,8,10,.92);border-bottom:1px solid var(--bd);height:62px;display:flex;align-items:center;padding:0 32px;gap:14px}
.nli{width:28px;height:28px;background:var(--neon);border-radius:7px;display:flex;align-items:center;justify-content:center}
.nli svg{width:15px;height:15px;fill:none;stroke:#000;stroke-width:2.5}
.nav-logo{display:flex;align-items:center;gap:10px}
.nlt{font-family:var(--fd);font-size:16px}
.nlt span{color:var(--neon)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px;position:relative;overflow:hidden}
main::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 40%,#00FF6A0C 0%,transparent 65%);pointer-events:none}
.box{position:relative;text-align:center;max-width:520px}
.code{font-family:var(--fd);font-size:clamp(90px,18vw,150px);line-height:1;color:var(--neon);letter-spacing:-.04em}
.code em{color:var(--t3);font-style:italic}
h1{font-family:var(--fd);font-size:clamp(22px,4vw,32px);margin:10px 0 12px;font-weight:400}
p{color:var(--t2);font-size:15px;line-height:1.7;margin-bottom:28px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn-p{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:var(--neon);color:#000;border:none;border-radius:var(--r2,10px);font-size:14px;font-weight:700;cursor:pointer;font-family:var(--fb)}
.btn-p:hover{background:#00e55f}
.btn-s{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:transparent;color:var(--txt);border:1px solid var(--bd2);border-radius:var(--r2,10px);font-size:14px;font-weight:600;cursor:pointer;font-family:var(--fb)}
.btn-s:hover{border-color:var(--nm);color:var(--neon)}
footer{padding:24px;border-top:1px solid var(--bd);text-align:center;color:var(--t3);font-size:12px}
</style>
</head>
<body>
<nav class="main-nav">
  <a href="/index.html" class="nav-logo">
    <div class="nli"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5L20.23 7.25L20.23 16.75L12 21.5L3.77 16.75L3.77 7.25Z"/><ellipse cx="12" cy="12" rx="3.1" ry="4.3"/></svg></div>
    <div class="nlt">AgroGlobal<span>Dex</span></div>
  </a>
</nav>
<main>
  <div class="box">
    <div class="code">4<em>0</em>4</div>
    <h1>Esta parcela todavía no está sembrada</h1>
    <p>La página que buscas no existe o fue movida. Puede que el enlace esté desactualizado — el sitio está en desarrollo activo.</p>
    <div class="btns">
      <a href="/index.html" class="btn-p">← Volver al inicio</a>
      <a href="/marketplace.html" class="btn-s">Ver el marketplace</a>
      <a href="/contact.html" class="btn-s">Contacto</a>
    </div>
  </div>
</main>
<footer>© 2026 AgroGlobalDex · Demo/PoC · Proyecto en desarrollo</footer>
<script src="/js/alive.js" defer></script>
</body>
</html>
